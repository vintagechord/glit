<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="desk-token" content="__CSRF_TOKEN__">
  <meta name="color-scheme" content="light">
  <title>온사이드 심의 데스크</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231b332f'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23d8f58b' stroke-width='7'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23d8f58b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="온사이드 심의 데스크 홈"><span class="brand-mark">o</span><span>ONSIDE<span class="brand-sub">심의 데스크</span></span></a>
    <div class="workspace-label">MY WORKSPACE <span>LOCAL</span></div>
    <nav aria-label="주 메뉴">
      <button class="nav-item active" data-nav="cases"><span class="nav-icon">▤</span> 신청 관리 <span class="nav-count" id="nav-count">0</span></button>
      <button class="nav-item" data-nav="manual"><span class="nav-icon">✎</span> 관리자 수동 작업 <span class="nav-count" id="manual-count">0</span></button>
      <div id="manual-subnav" class="manual-subnav" hidden><button data-manual-type="ALBUM">음반</button><button data-manual-type="MV">뮤비</button></div>
      <button class="nav-item" data-nav="queue"><span class="nav-icon">◷</span> 작업 현황 <span class="nav-count" id="job-count">0</span></button>
      <button class="nav-item" data-nav="settings"><span class="nav-icon">⚙</span> 데스크 설정</button>
    </nav>
    <div class="sidebar-note"><span class="signal-dot"></span> 온사이드와 연결된 작업 공간<p>자료 준비부터 결과 안내까지<br>신청별로 이어서 관리합니다.</p></div>
    <div class="sidebar-footer"><span class="avatar">O</span><div>온사이드 운영<span>심의 데스크 · v2.3.2</span></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="breadcrumb">WORKSPACE <span>/</span> <strong id="page-label">신청 관리</strong></div><div class="topbar-right"><span id="connection-badge" class="connection-badge"><i></i> 연결 확인 중</span><button class="icon-button" id="refresh-top" title="신청 내역 새로 가져오기" aria-label="신청 내역 새로 가져오기">↻</button></div></header>
    <div id="global-alert" role="status" hidden></div>
    <section id="screen" class="screen"><div class="loading-state"><span class="spinner"></span><h1>심의 데스크를 여는 중입니다</h1><p>이 Mac에 저장된 작업 내용을 확인하고 있어요.</p></div></section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title">변경 사항</h2><p id="confirm-message"></p><div class="button-row"><button value="cancel" class="button secondary">계속 편집</button><button value="confirm" class="button primary">변경 버리기</button></div></form></dialog>
</body>
</html>
