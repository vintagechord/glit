# Separate paid worker Blueprint. The previous no-new-cost deployment did not
# create this service; deploying the web app alone does not start this worker.
# Review the recurring compute cost before creating it (see deployment report).
# Existing production render.yaml is intentionally unaffected.
services:
  - type: worker
    name: onside-review-docs-worker
    repo: https://github.com/vintagechord/glit
    branch: main
    runtime: docker
    dockerfilePath: ./services/review-docs/Dockerfile
    dockerContext: .
    plan: standard
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      # Prepared during the original web/DB rollout but never linked to a worker.
      # Must contain the same Supabase and private B2 settings as the web service.
      - fromGroup: onside-review-docs
      # OPENAI_API_KEY may be added to the worker's environment for automatic
      # translation. It is optional for extraction and DOCX/ZIP generation.
      - key: OPENAI_TRANSLATION_MODEL
        value: gpt-5.5
