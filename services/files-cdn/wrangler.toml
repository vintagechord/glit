# Onside file downloads through Cloudflare (Backblaze egress to Cloudflare is free).
# Deploy: npx wrangler@4 deploy --config services/files-cdn/wrangler.toml
# Secrets (never in this file): B2_S3_ENDPOINT, B2_REGION, B2_BUCKET (same as the
# Onside service), B2_KEY_ID, B2_APPLICATION_KEY, FILES_SIGNING_SECRET
#   npx wrangler@4 secret put <NAME> --config services/files-cdn/wrangler.toml
name = "onside-files"
main = "src/index.mjs"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://iamonside.com,https://www.iamonside.com"

[observability]
enabled = true
